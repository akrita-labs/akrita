[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akrita"
version = "0.1.0"
description = "AKRITA — autonomous multi-agent Polymarket V2 keeper with USYC active margin"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5,<3.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "eth-abi>=5.0",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "adapters*", "orchestrator*", "agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["orchestrator/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
