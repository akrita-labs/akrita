# AKRITA — docker-compose for local development.
#
# Live integrations only. Provide credentials via .env / secrets/
# (see .env.example) before bringing the stack up.

services:
  postgres:
    image: postgres:16-alpine
    container_name: akrita-postgres
    environment:
      POSTGRES_USER: akrita
      POSTGRES_PASSWORD: akrita
      POSTGRES_DB: akrita
    ports:
      - "5432:5432"
    volumes:
      - akrita-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akrita -d akrita"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: akrita-redis
    ports:
      - "6379:6379"
    volumes:
      - akrita-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: akrita-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    env_file: .env
    environment:
      # Docker-internal hostnames override the local-dev defaults in .env.
      POSTGRES_DSN: postgresql+asyncpg://akrita:akrita@postgres:5432/akrita
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nomos:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        AGENT_NAME: nomos
    container_name: akrita-nomos
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

  spatha:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        AGENT_NAME: spatha
    container_name: akrita-spatha
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

  agros:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        AGENT_NAME: agros
    container_name: akrita-agros
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  akrita-postgres-data:
  akrita-redis-data:
