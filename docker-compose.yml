version: "3.9"

# AKRITA — docker-compose for local development.
#
# Live integrations only. Provide credentials via .env / secrets/
# (see .env.example) before bringing the stack up.

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: akrita-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - ARC_RPC_URL=${ARC_RPC_URL:-https://rpc.testnet.arc.io}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-https://polygon-rpc.com}
      - TRACE_REGISTRY_ADDR=${TRACE_REGISTRY_ADDR:-0x1111111111111111111111111111111111111111}
      - BUILDER_REGISTRY_ADDR=${BUILDER_REGISTRY_ADDR:-0x2222222222222222222222222222222222222222}
      - POLY_BUILDER_CODE=${POLY_BUILDER_CODE:-0xababababababababababababababababababababababababababababababababab}
    restart: unless-stopped

  nomos:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        AGENT_NAME: nomos
    container_name: akrita-nomos
    depends_on:
      - orchestrator
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - PRICING_QUOTE_INTERVAL=${PRICING_QUOTE_INTERVAL:-10}
      - APPETITE_PROFILE=${APPETITE_PROFILE:-balanced}
      - SUBSCRIBED_MARKETS=${SUBSCRIBED_MARKETS:-}
    restart: unless-stopped

  spatha:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        AGENT_NAME: spatha
    container_name: akrita-spatha
    depends_on:
      - orchestrator
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - HEDGE_CHECK_INTERVAL=${HEDGE_CHECK_INTERVAL:-5}
      - HEDGE_INVENTORY_THRESHOLD=${HEDGE_INVENTORY_THRESHOLD:-500}
    restart: unless-stopped

  agros:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        AGENT_NAME: agros
    container_name: akrita-agros
    depends_on:
      - orchestrator
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - TREASURY_SWEEP_INTERVAL=${TREASURY_SWEEP_INTERVAL:-60}
      - SAFETY_MULTIPLIER=${SAFETY_MULTIPLIER:-1.5}
      - MIN_USDC_BUFFER=${MIN_USDC_BUFFER:-200}
    restart: unless-stopped
